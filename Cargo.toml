[workspace]
members = ["bundle"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "MIT"
repository = "https://github.com/worldcoin/tabernaculum"
publish = false

[workspace.dependencies]
hex = { version = "0.4", default-features = false, features = ["alloc"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false }
tempfile = "3.27"
thiserror = "2"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
tokio-vsock = "0.7.2"
tracing = "0.1"
vsock = "0.5"
