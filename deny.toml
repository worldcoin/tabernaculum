# One policy for the repository's Cargo workspace.
[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[bans]
multiple-versions = "allow"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "openssl-src" },
]

[licenses]
version = 2
confidence-threshold = 1.0
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Unicode-3.0",
]

# Minijail's Rust crates inherit the repository's BSD license but omit Cargo metadata.
[[licenses.clarify]]
name = "minijail"
version = "0.2.3"
expression = "BSD-3-Clause"
license-files = [{ path = "../../LICENSE", hash = 0x51549d2b }]

[[licenses.clarify]]
name = "minijail-sys"
version = "0.0.14"
expression = "BSD-3-Clause"
license-files = [{ path = "../../LICENSE", hash = 0x51549d2b }]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/google/minijail"]
