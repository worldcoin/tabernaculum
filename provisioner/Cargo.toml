[package]
name = "tabernaculum-provisioner"
description = "Sidecar that fetches a pinned worker bundle, boots the Nitro enclave and provisions it over vsock"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "tabernaculum-provisioner"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
hex.workspace = true
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tabernaculum-bundle = { path = "../bundle", features = ["host"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "process", "signal"] }
tracing.workspace = true
tracing-subscriber.workspace = true
