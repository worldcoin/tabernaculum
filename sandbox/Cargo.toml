[package]
name = "tabernaculum"
description = "Minijail sandbox for closed workers in Nitro enclaves: jail, seccomp policy, lifecycle and framed IPC"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
test-worker = []

[dependencies]
tabernaculum-bundle = { path = "../bundle", features = ["enclave"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
minijail.workspace = true

[[bin]]
name = "sandbox-test-worker"
path = "tests/support/fake-worker.rs"
required-features = ["test-worker"]
test = false

[[test]]
name = "process"
required-features = ["test-worker"]
harness = false
