[package]
name = "tabernaculum-bundle"
description = "Single-executable worker bundles for Nitro enclaves: format, enclave receive, host provisioning"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Enclave-side bootstrap: accept one bundle from the parent over vsock.
enclave = ["dep:libc", "dep:vsock"]
# Host-side provisioning over vsock.
host = ["dep:tokio", "dep:tokio-vsock", "dep:tracing"]

[dependencies]
hex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"], optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true, optional = true }
tokio-vsock = { workspace = true, optional = true }
vsock = { workspace = true, optional = true }
